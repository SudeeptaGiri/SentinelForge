# Description: Dependency & build configuration for the SentinelForge agent system.
# Need: A single source of truth for Python package dependencies, tooling, and
#       build metadata so the agent service can be packaged and deployed reproducibly.
# Motive: Use Poetry to pin ADK, Vertex AI, FastAPI, and MCP client/server libraries
#         so every environment (local, CI, Agent Engine) resolves identical versions.

[tool.poetry]
name = "sentinelforge"
version = "0.1.0"
description = "Autonomous AI DevSecOps Agent"
authors = ["SentinelForge Team"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.136.0"
uvicorn = "^0.46.0"
pydantic = "^2.13.0"
google-adk = ">=1.33.0"
google-genai = ">=1.75.0"
google-auth = ">=2.52.0"
google-cloud-aiplatform = ">=1.151.0"
google-cloud-logging = ">=3.15.0"
mcp = ">=1.27.0,<2"
GitPython = ">=3.1.50"
jinja2 = "^3.1.6"
pyyaml = "^6.0.3"
requests = "^2.33.1"
python-dotenv = "^1.2.2"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.0"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"