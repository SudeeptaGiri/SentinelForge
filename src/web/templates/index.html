<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SentinelForge — Live Pipeline Tracker</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="brand-mark">&#9679;</span>
      <div>
        <h1>SentinelForge</h1>
        <p>Autonomous AI DevSecOps Agent — Live Pipeline Tracker</p>
      </div>
    </div>
    <button id="start-btn" class="btn btn-primary">Run Migration/Cost Demo</button>
  </header>

  <main class="layout">
    <section class="stepper-panel">
      <div class="stepper-header">
        <h2>Pipeline Steps</h2>
        <div class="progress-track">
          <div id="progress-fill" class="progress-fill" style="width: 0%"></div>
        </div>
        <span id="progress-label">0% complete</span>
      </div>
      <ol id="stepper" class="stepper">
        {% for step in steps %}
        <li class="step" data-step-id="{{ loop.index }}">
          <div class="step-icon" id="icon-{{ loop.index }}">{{ loop.index }}</div>
          <div class="step-body">
            <div class="step-title-row">
              <span class="step-name">{{ step }}</span>
              <span class="step-status" id="status-{{ loop.index }}">PENDING</span>
            </div>
            <div class="step-meta">
              <span id="agent-{{ loop.index }}" class="step-agent"></span>
              <span id="log-{{ loop.index }}" class="step-log"></span>
            </div>
          </div>
        </li>
        {% endfor %}
      </ol>
    </section>

    <aside class="panel">
      <h2>Pipeline Status</h2>
      <p id="pipeline-id" class="muted">No active run yet.</p>
      <div id="result-box" class="result-box hidden"></div>
    </aside>
  </main>

  <div id="gate-modal" class="modal hidden">
    <div class="modal-card">
      <h3 id="gate-title">Confirmation Required</h3>
      <p id="gate-summary"></p>
      <div class="modal-actions">
        <button id="gate-reject" class="btn btn-danger">Reject</button>
        <button id="gate-approve" class="btn btn-success">Approve &amp; Proceed</button>
      </div>
    </div>
  </div>

  <!-- Rich rejection modal — shown when user clicks Reject in gate modal -->
  <div id="reject-modal" class="modal hidden">
    <div class="modal-card reject-modal-card">
      <h3>Reject Step</h3>
      <p id="reject-gate-title" class="muted"></p>

      <div class="reject-detail-section">
        <h4 class="reject-section-label">Step Output</h4>
        <div id="reject-artifact" class="artifact-scroll"></div>
      </div>

      <div class="reject-reason-section">
        <label for="reject-reason" class="reject-reason-label">
          Rejection reason <span class="required-star">*</span>
        </label>
        <textarea
          id="reject-reason"
          class="reject-textarea"
          rows="3"
          placeholder="Describe what should change — e.g. 'Use GKE instead of Cloud Run', 'Add rate limiting', 'Fix the critical CVE first'..."
        ></textarea>
      </div>

      <div class="modal-actions">
        <button id="reject-cancel-btn" class="btn btn-secondary">Cancel</button>
        <button id="reject-confirm-btn" class="btn btn-danger" disabled>Confirm Reject</button>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
